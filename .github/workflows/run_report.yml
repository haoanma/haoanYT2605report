name: 每日投资日报自动生成(网页版)

on:
  schedule:
    # UTC 05:30 = 北京时间 13:30，已过美东午夜(夏令时04:00 UTC/冬令时05:00 UTC)，
    # 雅虎此时才稳定提供前一交易日的日线；早上运行会拿到前两日的数据
    - cron: '30 5 * * *'
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 开启部署网页的权限
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装依赖 (引入了 Nasdaq 库)
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance jinja2 python-dateutil nasdaq-data-link

    - name: 4. 运行投资日报脚本
      run: python report.py

    - name: 5. 自动发布网页到 gh-pages 分支
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public # 把刚才生成的 index.html 发布为网站
        force_orphan: true

    - name: 6. 把日报发到邮箱 (凭据在仓库 Secrets, 未配置则跳过)
      env:
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        MAIL_TO: ${{ secrets.MAIL_TO }}
        REPORT_URL: https://haoanma.github.io/haoanYT2605report/
      run: python code/send_email.py
