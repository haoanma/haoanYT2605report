name: 每日投资日报自动生成

on:
  schedule:
    # 这里的运行时间是 UTC 时间。0:30 代表北京时间早上 8:30。
    # 1-5 代表周一到周五运行。如果你想每天都运行，把 1-5 改成 *
    - cron: '30 0 * * 1-5' 
  workflow_dispatch: # 保留这个标签，代表你随时可以手动点击运行

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. 拉取你的代码
      uses: actions/checkout@v4

    - name: 2. 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装依赖库和无头浏览器内核 (Playwright)
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance jinja2 playwright python-dateutil
        playwright install chromium --with-deps

    - name: 4. 运行你的投资日报脚本
      run: python report.py

    - name: 5. 收集并保存生成的 PDF 报告
      uses: actions/upload-artifact@v4
      with:
        name: 投资日报-PDF版
        path: reports/*.pdf
        retention-days: 7 # 生成的报告在云端保留 7 天后自动清理
